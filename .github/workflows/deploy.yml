name: Deploy Backend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy en VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e  # Aborta inmediatamente si algún comando falla
            cd /var/www/fastcashier/backend
            
            # Sincronización estricta sin conflictos
            git fetch origin main
            git reset --hard origin/main
            
            # npm ci garantiza dependencias exactas usando el package-lock.json
            npm ci
            
            NODE_OPTIONS="--max-old-space-size=512" npm run build
            pm2 restart fastcashier-api
